name = "daemon"
main = "src/mcp-worker.ts"
compatibility_date = "2025-08-20"

[observability]
enabled = true

[[kv_namespaces]]
binding = "KV"
id = "901f02847dec42f18ed4dedf7054af08"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
MEMORYD_URL = "https://rob-memoryd.robert-chuvala.workers.dev"  # rob-memoryd front door (T-244); no secret here, caller bearer is forwarded

[[services]]
binding = "MEMORYD"
service = "rob-memoryd"  # service binding — the daemon's route to Rob's memory authority (T-244)

# Ring 2 (2026-08-18): per-IP rate limit on the public MCP surface — 120 requests / 60s per client IP (simple, per-colo, eventually consistent)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
